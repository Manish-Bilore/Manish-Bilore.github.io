# One block per project. This file is the only thing you edit to add or update work.
#   path        where the card links to. An external URL, or a local .qmd in projects/
#   date        controls ordering (newest first). Bump it when a project gets a real update.
#   image       images/..., local files, so nothing breaks if a project site moves
#   categories  free text; they become the filter chips on the Work page

- title: "Space Syntax, decomposed"
  path: "https://manish-bilore.github.io/space-syntax-decomposed/"
  date: "2026-10-09"
  description: >
    Space Syntax (depthmapX) and street-network analysis (cityseer) rank the same streets of
    Copenhagen and Mumbai differently. A five-rung ladder changes one design choice at a time,
    graph, cost, normalisation, engine, axial lines, and measures what each does to rank
    agreement. Normalisation is the largest single step: at 400 m, metric closeness and NAIN
    are unrelated (Spearman ρ ≈ 0), and junction consolidation alone changes Copenhagen's
    street count 4.2×.
  image: "images/space-syntax-windows.jpg"
  image-alt: "Indre By, Colaba and Dharavi at the same scale under NAIN, NACH and metric harmonic closeness"
  categories: [space syntax, street networks, depthmapX, cityseer, OpenStreetMap]

- title: "SAR flood mapping without Earth Engine"
  path: "https://manish-bilore.github.io/sar-flood-mapping/"
  date: "2026-09-24"
  description: >
    Sentinel-1 flood extents for Indian events, rebuilt from public archives on one laptop:
    thresholding and change detection, InSAR coherence, and five segmentation networks trained
    on Sen1Floods11, in a Quarto report that regenerates per event. The networks score
    0.663–0.681 test IoU yet map extents that differ 3–3.5× on the same scene. Kerala 2018
    comes to 508 km², Assam 2022 to 320 km²; for Mumbai 2024 the flood is not separable at
    all, because revisit, not method, is the binding constraint.
  image: "images/sar-flood-kerala.jpg"
  image-alt: "Kerala 2018: share of methods agreeing on flooding, and the final extent over co-event VV backscatter"
  categories: [SAR, Sentinel-1, flood, deep learning, InSAR coherence]

- title: "Anthropogenic heat and air-conditioner adoption in Greater Mumbai"
  path: "https://manish-bilore.github.io/mumbai-anthropogenic-heat/"
  date: "2026-09-19"
  description: >
    A bottom-up building energy model over all 580,890 buildings in the 24 BMC wards, coupled
    to a household agent-based model of air-conditioner purchase, with waste heat fed back
    into next year's discomfort. Mean heat flux over built cells rises from 20.58 to
    23.81 W/m² between 2026 and 2040 as AC ownership goes from 17.9% to 56.2%; informal
    dwellings run about 1.6 °C hotter than tower flats. An uncalibrated prototype: the
    trajectories are structural, not predictive.
  image: "images/mumbai-qf-grid.png"
  image-alt: "Anthropogenic heat flux across Greater Mumbai on a 100 m grid"
  categories: [anthropogenic heat, UBEM, agent-based model, urban climate, Mumbai]

- title: "Nagpur Digital Urban Climate Twin"
  path: "https://manish-bilore.github.io/nagpur-duct-site/"
  date: "2026-09-01"
  description: >
    860,000 building footprints and 96 hours of WRF fields, in the browser. WRF-ARW on
    7.5/1.5/0.3 km nests drives PALM-4U at 10 m and a CEA stock model for cooling demand;
    the site is the validation record: 2 m air temperature against station observation,
    and what each configuration change actually bought.
  image: "images/nagpur-viewer.jpg"
  image-alt: "3D buildings under a WRF air-temperature field, station validation panel open"
  categories: [urban climate, WRF, PALM-4U, LCZ, validation]

- title: "Ontology-driven water distribution twin"
  path: "https://manish-bilore.github.io/wdn-digital-twin/"
  date: "2026-08-20"
  description: >
    An IIT Bombay campus network from an estate-office CAD drawing to a graph you can
    question: 322 pipes, 18.8 km of main, 29 monitoring nodes, 8,554 triples. EPANET 2.2
    hydraulics, K-means district metering and an OWL 2 DL ontology, with SPARQL running
    client-side in the reader's browser.
  image: "images/wdn-sensors.png"
  image-alt: "Campus water network with 29 monitoring nodes across five district metered areas"
  categories: [digital twin, EPANET, ontology, SPARQL, IoT]

- title: "InSAR time series for urban land subsidence"
  path: "projects/insar-subsidence.qmd"
  date: "2025-06-30"
  description: >
    M.Tech thesis. Two open-source Sentinel-1 time-series chains, MintPy on the Alaska
    Satellite Facility cloud and LiCSBAS on LiCSAR interferograms, run over the same frame to
    separate what a subsidence map measures from what its processing decides. Lucknow reaches
    −63.9 mm/yr; the deformation field then trains an XGBoost susceptibility model (AUC 0.705)
    for the ground with no scatterers to measure.
  image: "images/psinsar/lssm.jpg"
  image-alt: "Land subsidence susceptibility map of Lucknow in five risk zones"
  categories: [InSAR, Sentinel-1, subsidence, XGBoost, thesis]

- title: "Landslide susceptibility by fuzzy inference"
  path: "projects/landslide-fuzzy-inference.qmd"
  date: "2024-11-15"
  description: >
    Twelve conditioning parameters over Wayanad district: random-forest land cover from
    Sentinel-2, NDVI and Cartosat DEM derivatives feeding a fuzzy inference system, chosen so
    the rule base stays legible where the landslide inventory is thin.
  image: "images/gnr627-lulc.jpg"
  image-alt: "Random-forest land cover classification of Wayanad district"
  categories: [landslide, fuzzy inference, random forest, Sentinel-2, R]

- title: "Synthetic geospatial urban data"
  path: "projects/synthetic-urban-data.qmd"
  date: "2024-11-01"
  description: >
    Trip data for Bandra, Mumbai, where none exists to plan with. A synthetic population
    carrying local socio-economic structure, mobility simulated against land use and transit,
    calibrated against what little real data exists, then demand predicted per hexagon and
    tested for spatial clustering.
  image: "images/som787-morans.png"
  image-alt: "Local Moran's I cluster map of predicted demand across Bandra"
  categories: [synthetic data, mobility, random forest, spatial statistics, R]

- title: "Surface run-off water mitigation"
  path: "projects/surface-runoff-mitigation.qmd"
  date: "2021-07-01"
  description: >
    MA thesis, CITA studio, Royal Danish Academy. Run the water first: 100,000-particle
    simulation of rainfall and surface water rise over the terrain as it is, then a procedural
    script that places mitigating elements against the inundation it exposes. Five
    interventions, each graded by simulating the same terrain with and without it.
  image: "images/runoff/amager-wetlands.jpg"
  image-alt: "Proposed wetland and holding-pond network threaded between new housing on Amager"
  categories: [particle simulation, flood, landscape, procedural design, thesis]

- title: "Ventilation design as disease control"
  path: "projects/tanzania-ventilation.qmd"
  date: "2022-12-01"
  description: >
    CFD of airflow and thermal conditions for experimental solar housing in Tanzania, validated
    against measured PET and UTCI with IoT sensor units built in Copenhagen and monitored
    remotely. The design objective was mosquito control through ventilation, the first
    microclimate model I had to defend as a health claim rather than a physics result.
  categories: [CFD, thermal comfort, IoT, field deployment]
