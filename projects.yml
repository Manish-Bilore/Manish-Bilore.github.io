# One block per project. This file is the only thing you edit to add or update work.
#   path        where the card links to. An external URL, or a local .qmd in projects/
#   date        controls ordering (newest first). Bump it when a project gets a real update.
#   image       images/... — local files, so nothing breaks if a project site moves
#   categories  free text; they become the filter chips on the Work page

- title: "Nagpur Digital Urban Climate Twin"
  path: "https://manish-bilore.github.io/nagpur-duct-site/"
  date: "2026-09-01"
  description: >
    Whether the chain that produces a heat-mitigation number can be trusted. WRF-ARW on
    7.5/1.5/0.3 km nests with a single-layer urban canopy and a city-specific anthropogenic
    heat profile, driving PALM-4U at 10 m and a CEA stock model for cooling demand. The site
    is the validation record: 2 m air temperature against station observation at Mahal, and
    what each configuration change actually bought. 860k building footprints and 96 h of WRF
    fields render in the browser.
  image: "images/nagpur-viewer.jpg"
  image-alt: "3D buildings under a WRF air-temperature field, station validation panel open"
  categories: [urban climate, WRF, PALM-4U, LCZ, validation]

- title: "Ontology-driven water distribution twin"
  path: "https://manish-bilore.github.io/wdn-digital-twin/"
  date: "2026-08-20"
  description: >
    An IIT Bombay campus network from an estate-office AutoCAD drawing to a queryable
    knowledge graph. EPANET 2.2 hydraulics over 322 pipes and 18.8 km of main, K-means
    district metering with a hierarchical overlay filter on elevation, pressure and demand
    placing 29 monitoring nodes, and an OWL 2 DL ontology aligned to SOSA/SSN and QUDT.
    SPARQL runs client-side over all 8,554 triples, so a question spanning hydraulics and
    instrumentation becomes a query rather than a fortnight of cross-referencing.
  image: "images/wdn-sensors.png"
  image-alt: "Campus water network with 29 monitoring nodes across five district metered areas"
  categories: [digital twin, EPANET, ontology, SPARQL, IoT]

- title: "InSAR time series for urban land subsidence"
  path: "projects/insar-subsidence.qmd"
  date: "2025-06-30"
  description: >
    M.Tech thesis. Two open-source Sentinel-1 time-series chains — MintPy on the Alaska
    Satellite Facility cloud and LiCSBAS on LiCSAR interferograms — run over the same frame
    to separate what a subsidence map measures from what its processing decides. Lucknow
    reaches −63.9 mm/yr in peri-urban pockets; Delhi, Chandigarh, Mumbai and Kolkata follow.
    The deformation field then trains an XGBoost susceptibility model (AUC 0.705) for the
    parts of the city with no scatterers to measure.
  image: "images/psinsar/lssm.jpg"
  image-alt: "Land subsidence susceptibility map of Lucknow in five risk zones"
  categories: [InSAR, Sentinel-1, subsidence, XGBoost, thesis]

- title: "Landslide susceptibility by fuzzy inference"
  path: "projects/landslide-fuzzy-inference.qmd"
  date: "2024-11-15"
  description: >
    Predictive mapping of landslide-prone terrain in Wayanad district from twelve conditioning
    parameters. Random-forest land cover from Sentinel-2, NDVI and Cartosat DEM derivatives
    feed a fuzzy inference system, chosen so the rule base stays legible where training
    inventories are thin.
  image: "images/gnr627-lulc.jpg"
  image-alt: "Random-forest land cover classification of Wayanad district"
  categories: [landslide, fuzzy inference, random forest, Sentinel-2, R]

- title: "Synthetic geospatial urban data"
  path: "projects/synthetic-urban-data.qmd"
  date: "2024-11-01"
  description: >
    Trip data for Bandra, Mumbai, where none exists to plan with. A synthetic population
    carrying local demographic and socio-economic structure, mobility simulated against land
    use and transit availability, then calibrated by comparing aggregate metrics against what
    little real data is available. Demand is predicted per hexagon and tested for spatial
    clustering.
  image: "images/som787-morans.png"
  image-alt: "Local Moran's I cluster map of predicted demand across Bandra"
  categories: [synthetic data, mobility, random forest, spatial statistics, R]

- title: "Surface run-off water mitigation"
  path: "projects/surface-runoff-mitigation.qmd"
  date: "2021-07-01"
  description: >
    MA thesis, CITA studio, Royal Danish Academy. A design work-flow that runs the water
    first: meshless particle simulation of rainfall and surface water rise over the terrain
    as it is, then a procedural script that places mitigating elements against the inundation
    it exposes. Five interventions — flood-able park, weir, drain channel, underground tank,
    living retaining wall — each graded by simulating the same terrain with and without it,
    then scaled to a porous urban form for Tårnby, Copenhagen.
  image: "images/runoff/amager-wetlands.jpg"
  image-alt: "Proposed wetland and holding-pond network threaded between new housing on Amager"
  categories: [particle simulation, flood, landscape, procedural design, thesis]

- title: "Ventilation design as disease control"
  path: "projects/tanzania-ventilation.qmd"
  date: "2022-12-01"
  description: >
    CFD of airflow and thermal conditions for experimental solar housing in Tanzania,
    validated against measured PET and UTCI with IoT sensor units built in Copenhagen,
    deployed on site and monitored remotely. The design objective was mosquito control
    through ventilation — the first microclimate model I had to defend as a health claim
    rather than as a physics result.
  categories: [CFD, thermal comfort, IoT, field deployment]
