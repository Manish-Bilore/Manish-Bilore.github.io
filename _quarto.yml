project:
  type: website
  output-dir: _site

website:
  title: "Manish Bilore"
  site-url: "https://manish-bilore.github.io"
  description: "Urban climate modelling, remote sensing and GeoAI for Indian cities."
  open-graph: true
  navbar:
    pinned: false
    left:
      - text: "Work"
        href: projects.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/Manish-Bilore
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/manish-b-44212084/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:manish.bilore@gmail.com
        aria-label: Email
  page-footer:
    border: false
    left: "Manish Bilore · Delhi NCR"
    right: "Source on [GitHub](https://github.com/Manish-Bilore/Manish-Bilore.github.io)"

format:
  html:
    theme: [litera, styles.scss]
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-in-header: _includes/fonts.html
    grid:
      body-width: 900px
      sidebar-width: 180px
      margin-width: 180px
